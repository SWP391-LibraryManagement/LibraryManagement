name: Repair staging metadata schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-staging
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Prepare backend repair package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy/backend | Out-Null
          Copy-Item backend/package.json,backend/package-lock.json deploy/backend/
          Copy-Item backend/src deploy/backend/src -Recurse
          New-Item -ItemType Directory -Force deploy/backend/scripts | Out-Null
          Copy-Item backend/scripts/migrateLibraryMetadata.js deploy/backend/scripts/
          New-Item -ItemType Directory -Force deploy/backend/database/migrations | Out-Null
          Copy-Item database/migrations/2026-07-22-library-metadata-compatibility.sql deploy/backend/database/migrations/
          New-Item -ItemType Directory -Force deploy/backend/migration-runtime | Out-Null
          Copy-Item backend/package.json,backend/package-lock.json deploy/backend/migration-runtime/

      - name: Install migration runtime dependencies
        run: npm ci --omit=dev
        working-directory: deploy/backend/migration-runtime

      - name: Deploy migration-ready backend package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy/backend

      - name: Apply reviewed library metadata migration
        shell: pwsh
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: ./scripts/invoke-appservice-library-metadata-migration.ps1

      - name: Verify staging endpoints
        run: npm run smoke:staging
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
