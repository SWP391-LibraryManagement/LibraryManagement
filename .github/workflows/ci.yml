name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  migration-runtime-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Kudu-compatible Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18.17.1
          cache: npm
          cache-dependency-path: scripts/library-metadata-migration-runtime/package-lock.json

      - name: Install locked migration runtime with strict engines
        run: npm ci --omit=dev --engine-strict
        working-directory: scripts/library-metadata-migration-runtime

      - name: Audit isolated migration runtime
        run: npm audit --omit=dev
        working-directory: scripts/library-metadata-migration-runtime

      - name: Exercise the SQL connection path
        run: node -e "const sql = require('mssql'); const pool = new sql.ConnectionPool({ server: '127.0.0.1', port: 1, user: 'runtime-probe', password: 'runtime-probe', connectionTimeout: 250, options: { encrypt: false, trustServerCertificate: true } }); pool.connect().then(() => { throw new Error('Unexpected local SQL connection.'); }).catch((error) => { if (error.code !== 'ESOCKET') throw error; console.log('Kudu Node 18 SQL dependency path loaded.'); });"
        working-directory: scripts/library-metadata-migration-runtime

  foundation-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Root dependency audit
        run: npm audit --audit-level=high

      - name: Spec traceability gate (FR @spec coverage >= 70% for implemented features)
        run: npm run trace:enforce

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend dependency audit
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend dependency audit
        run: npm run audit:high
        working-directory: frontend

      - name: Backend tests
        run: npm test
        working-directory: backend

      - name: System integration tests
        run: npm run test:integration:system
        working-directory: backend

      - name: Backend coverage threshold
        run: npm run test:coverage:ci
        working-directory: backend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: System browser E2E
        run: npm run test:e2e

      - name: Deployment utility tests
        run: npm run test:deployment

      - name: Backend health import check
        run: node -e "const app = require('./src/index'); if (!app || typeof app.listen !== 'function') throw new Error('Express app export is invalid');"
        working-directory: backend
