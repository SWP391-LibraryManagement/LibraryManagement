name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      fe10_inbox_migration_confirmed:
        description: FE10 inbox migration was applied twice and verified on staging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: library-staging
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify FE10 inbox migration gate
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CONFIRMATION: ${{ inputs.fe10_inbox_migration_confirmed }}
          EXPECTED_MIGRATION_SHA256: ${{ vars.FE10_INBOX_MIGRATION_SHA256 }}
        run: |
          if (
            $env:EVENT_NAME -eq 'workflow_dispatch' -and
            "$env:MANUAL_CONFIRMATION".ToLowerInvariant() -ne 'true'
          ) {
            Write-Error 'Apply and verify the FE10 inbox migration twice before manual deployment.'
            exit 1
          }

          $expectedHash = "$env:EXPECTED_MIGRATION_SHA256".Trim().ToLowerInvariant()
          if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
            Write-Error 'The staging FE10 migration proof is missing or malformed.'
            exit 1
          }

          $migrationPath = 'database/migrations/2026-07-27-fe10-personal-inbox-read-state.sql'
          $utf8NoBom = [Text.UTF8Encoding]::new($false, $true)
          $migrationText = [IO.File]::ReadAllText($migrationPath, $utf8NoBom)
          $lfText = $migrationText.Replace("`r`n", "`n").Replace("`r", "`n")
          $crlfText = $lfText.Replace("`n", "`r`n")
          $lfHash = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($utf8NoBom.GetBytes($lfText))
          ).ToLowerInvariant()
          $crlfHash = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($utf8NoBom.GetBytes($crlfText))
          ).ToLowerInvariant()
          if ($expectedHash -notin @($lfHash, $crlfHash)) {
            Write-Error 'The reviewed FE10 migration does not match the staging migration proof.'
            exit 1
          }

          Write-Output 'FE10 migration proof accepted for the exact deployment head and LF/CRLF rendering.'

  deploy-backend:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare backend deployment package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy/backend | Out-Null
          Copy-Item backend/package.json,backend/package-lock.json deploy/backend/
          Copy-Item backend/src deploy/backend/src -Recurse
          New-Item -ItemType Directory -Force deploy/backend/database/migrations | Out-Null
          Copy-Item database/migrations/2026-07-22-library-metadata-compatibility.sql,database/migrations/add_change_password_otp_token_type.sql deploy/backend/database/migrations/

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy/backend

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build staging frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_URL }}/api

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true

  smoke-test:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify staging endpoints
        run: npm run smoke:staging
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
